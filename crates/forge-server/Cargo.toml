[package]
name = "forge-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
mio = { version = "1", features = ["net", "os-poll"] }
libc = "0.2"

[dev-dependencies]
forge-core = { path = "../forge-core" }
libc = "0.2"
